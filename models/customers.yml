version: 2

models:
  - name: customers
    description: >
      Customer records sourced from Salesforce. This model provides a
      trusted view of customer information for reporting and analytics.

    columns:
      - name: customer_id
        description: "Unique identifier for the customer."
        tests:
          - not_null
          - unique

      - name: customer_name
        description: "Name of the customer or account."

      - name: industry
        description: "Industry associated with the customer."

      - name: updated_at
        description: "Timestamp showing when the customer record was last updated in Salesforce."